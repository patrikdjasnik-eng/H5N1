[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h5n1-drone-safety"
version = "0.1.0"
description = "Offline simulation-first drone safety and cybersecurity research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["h5n1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
